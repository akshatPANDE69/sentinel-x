[package]
name = "sentinel-core"
version = "1.0.0"
edition = "2021"
authors = ["Sentinel-X Security Engineering Team"]
description = "High-Performance Zero-Trust Endpoint Security Agent Core"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "sentinel-core"
path = "src/main.rs"

[lib]
name = "sentinel_core"
path = "src/lib.rs"
